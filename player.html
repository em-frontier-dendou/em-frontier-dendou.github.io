<body>

<header class="site-header">
  <div class="wrap">
    <a class="wordmark" href="./">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><polygon points="8,2 20,2 26,8 26,20 20,26 8,26 2,20 2,8" fill="#3CFF9A"></polygon><polygon points="10,8 18,8 20,10 20,18 18,20 10,20 8,18 8,10" fill="#E6FFF0" fill-opacity="0.45"></polygon><path d="M8 2l2 6M20 2l-2 6M26 8l-6 2M26 20l-6-2M20 26l-2-6M8 26l2-6M2 20l6-2M2 8l6 2" stroke="#06231A" stroke-width="1" fill="none"></path></svg>

<!-- 開くときは player.html?name=掲載名 。記録表の名前を押すと、このページに来る。 -->
<main class="page wrap" id="player">
  <p class="back"><a href="./#board">記録表へ戻る</a></p>
  <h1 id="player-name">プレイヤーの記録</h1>
  <p class="player-summary" id="player-summary" hidden></p>
  <p class="player-note" id="player-note" hidden>順位は、記録表に出ている記録（区分ごとの最高記録）の順位です。順位が「—」の記録は、記録表には出ません。</p>
  <div id="player-boards"></div>
  <p class="status" id="status" role="status">読み込み中…</p>
  <noscript><p class="status">記録を見るには、JavaScriptを有効にしてください。</p></noscript>
</main>

<footer class="site-footer">
  <div class="wrap">

    <div>
      <div>運営：<span data-channel>エメラルド・フロンティア研究室</span></div>
